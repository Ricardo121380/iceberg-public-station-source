# Extend the maintained default rules.  These are line-and-path scoped
# exceptions for audited upstream examples; no directory is globally ignored.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "NewAPI token-response masking test fixtures"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^[[:space:]]*token := seedToken\(t, db, [1-4], "(list-token|searchable-token|detail-token|editable-token)", "(abcd1234efgh5678|ijkl1234mnop5678|qrst1234uvwx5678|yzab1234cdef5678)"\)[[:space:]]*$''',
  ]
  paths = [
    '''^controller/token_test\.go$''',
  ]

  [[rules.allowlists]]
  description = "NewAPI dashboard auth-version marker"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^[[:space:]]*c\.Header\("Auth-Version", "864b7076dbcd0a3c01b5520316720ebf"\)[[:space:]]*$''',
  ]
  paths = [
    '''^middleware/auth\.go$''',
  ]

  [[rules.allowlists]]
  description = "Jimeng request-key model identifiers"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^[[:space:]]*if \(reqKey === "jimeng_vgfm_t2v_l20" && imageCount > 0\) return "jimeng_vgfm_i2v_l20";[[:space:]]*$''',
    '''^[[:space:]]*if \(reqKey === "jimeng_v30_pro"\) return "jimeng_ti2v_v30_pro";[[:space:]]*$''',
    '''^[[:space:]]*if \(key === "jimeng_ti2v_v30_pro" \|\| key\.includes\("v30_pro"\)\) return "v30_pro";[[:space:]]*$''',
  ]
  paths = [
    '''^plugins/tasks/jimeng/plugin\.js$''',
  ]

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Private-key PEM envelope construction, not a key value"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^[[:space:]]*block, _ := pem\.Decode\(\[\]byte\("-----BEGIN PRIVATE KEY-----\\n" \+ privateKeyPEM \+ "\\n-----END PRIVATE KEY-----"\)\)[[:space:]]*$''',
  ]
  paths = [
    '''^relay/channel/vertex/service_account\.go$''',
  ]

[[rules]]
id = "gcp-api-key"

  [[rules.allowlists]]
  description = "Masking-function documentation example"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^[[:space:]]*// Mask API keys \(e\.g\., "api_key:AIzaSyAAAaUooTUni8AdaOkSRMda30n_Q4vrV70" -> "api_key:\*\*\*"\)[[:space:]]*$''',
  ]
  paths = [
    '''^relaykit/relayconvert/kitutil/mask\.go$''',
  ]
