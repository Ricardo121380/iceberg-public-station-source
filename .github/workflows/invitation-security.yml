name: Registration invitation security

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registration-invitation-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  sqlite-regression:
    name: SQLite full regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Run complete Go regression suite
        run: make test

  postgres-security:
    name: PostgreSQL invitation security matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: registration_invites_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registration_invites_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOWORK: 'off'
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/registration_invites_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Run PostgreSQL invitation security matrix
        run: >-
          go test ./model ./service ./controller ./router
          -run '^(TestRegistrationInvite|TestLinuxDO|TestTurnstile|TestValidateRegistrationInviteCode|TestHashRegistrationInviteCode|TestAuthFlow)'
          -count=1

  mysql-security:
    name: MySQL invitation security matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: registration_invites_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/registration_invites_test?parseTime=true&multiStatements=true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Run MySQL invitation security matrix
        run: >-
          go test ./model ./service ./controller ./router
          -run '^(TestRegistrationInvite|TestLinuxDO|TestTurnstile|TestValidateRegistrationInviteCode|TestHashRegistrationInviteCode|TestAuthFlow)'
          -count=1

  frontend-regression:
    name: Frontend invitation regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run complete Vitest suite
        run: bun run test

      - name: Build production frontend
        run: bun run build
