name: Task 05 LinuxDO invite database matrix

on:
  push:
    branches:
      - feat/linuxdo-invite-registration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linuxdo-invite-registration:
    name: LinuxDO invitation SQLite, MySQL, and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:task05-test-password@tcp(127.0.0.1:3306)/new_api_task05?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://postgres:task05-test-password@127.0.0.1:5432/new_api_task05?sslmode=disable

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: new_api_task05
          MYSQL_ROOT_PASSWORD: task05-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptask05-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: new_api_task05
          POSTGRES_PASSWORD: task05-test-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d new_api_task05"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run LinuxDO invitation transaction tests
        run: >-
          go test ./controller
          -run '^TestLinuxDOInviteRegistration(Transaction|ProviderIdentityConflict)(SQLite|MySQL|PostgreSQL)$'
          -count=1
